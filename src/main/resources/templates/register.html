<head th:replace="~{fragments/head.html}">
</head>

<body class="login-page">

<main class="login-container">

    <h1>Square Games</h1>

    <p>Créez votre compte</p>

    <div class="login-error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form class="login-form" method="POST" th:action="@{/register}">

        <div>
            <label for="username">Nom d'utilisateur :</label>
            <input id="username"
                   type="text"
                   name="username"
                   required/>
        </div>

        <div>
            <label for="email">Adresse e-mail :</label>
            <input id="email"
                   type="email"
                   name="email"
                   required/>
        </div>

        <div>
            <label for="password">Mot de passe :</label>
            <input id="password"
                   type="password"
                   name="password"
                   required/>
        </div>

        <button class="btn" type="submit">
            S'inscrire
        </button>

    </form>

    <p>
        Déjà un compte ?
        <a th:href="@{/login}">Se connecter</a>
    </p>

</main>

</body>
</html>
